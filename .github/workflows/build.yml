name: CI/CD with Semantic Release

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: |
          npm run lint
          npm run stylelint

      - name: Type check
        run: npm run type-check

      - name: Build web app
        run: npm run build:web

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/web
            !dist/web/**/*.map
          retention-days: 30

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: imzusheng/tm_gitlabWeeklyReport
        run: npm run release

      - name: Upload release build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-release
          path: |
            dist/web
            !dist/web/**/*.map
          retention-days: 30

  deploy:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

    steps:
      - name: Download release build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build-release
          path: dist/web

      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "缺少部署所需的环境变量，已中止。"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$DEPLOY_PORT" ]; then
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy to server via rsync
        run: |
          RSYNC_SSH="ssh"
          if [ -n "$DEPLOY_PORT" ]; then
            RSYNC_SSH="ssh -p $DEPLOY_PORT"
          fi
          rsync -az --delete -e "$RSYNC_SSH" dist/web/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
